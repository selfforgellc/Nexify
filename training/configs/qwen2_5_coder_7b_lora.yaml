# Nexify LoRA training config
# Use this after the dataset is real and reviewed.

base_model: Qwen/Qwen2.5-Coder-7B-Instruct
output_dir: training/outputs/nexify-qwen2.5-coder-7b-lora
train_file: training/data/processed/nexify_instructions.jsonl

# Keep this conservative. Increase only on a bigger GPU.
max_seq_length: 4096
num_train_epochs: 2
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.0002
warmup_ratio: 0.03
logging_steps: 10
save_steps: 100

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

packing: false
bf16: false
fp16: true
load_in_4bit: true
